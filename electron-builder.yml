appId: com.workboard.app
productName: Beyond the Dialogue
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
  # pi-mcp-adapter's only native module (@napi-rs/keyring, a prebuilt .node) cannot be
  # dlopen'd from inside the asar. It loads LAZILY — only when user-added MCP config
  # reaches for the OS credential store — but it must be present and unpacked so that
  # path can work at all. research R7b / tasks T062: Linux verified, Windows unexercised.
  - "**/node_modules/@napi-rs/**"
  - "**/node_modules/**/keyring-*.node"
extraResources:
  # Bundled LLM-WiKi pattern guide — seeded into each created wiki (see src/main/wiki/wiki.ts).
  - from: src/main/wiki/LLM-WiKi.md
    to: LLM-WiKi.md
  # Window/taskbar icon for packaged builds (the BrowserWindow icon seam in
  # src/main/index.ts reads it from resourcesPath). The same build/icon.png is
  # also the source electron-builder converts into the per-platform installer
  # icons (.ico / .icns / hicolor PNGs) via directories.buildResources.
  - from: build/icon.png
    to: icon.png
npmRebuild: false
electronLanguages:
  - en-US
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: monster
  synopsis: An AI-native desktop work board
deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2
    # pi-mcp-adapter's credential store (@napi-rs/keyring) uses the Secret Service API
    # on Linux. Only reached when user-added MCP config opts into it (T062/R7b), but the
    # library must be present for that path to load.
    - libsecret-1-0
win:
  target:
    - nsis
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
