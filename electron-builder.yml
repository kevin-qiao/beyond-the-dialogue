appId: com.workboard.app
productName: Beyond the Dialogue
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
extraResources:
  # Bundled LLM-WiKi pattern guide — seeded into each created wiki (see src/main/wiki/wiki.ts).
  - from: src/main/wiki/LLM-WiKi.md
    to: LLM-WiKi.md
npmRebuild: false
electronLanguages:
  - en-US
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: monster
  synopsis: An AI-native desktop work board
deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2
win:
  target:
    - nsis
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
