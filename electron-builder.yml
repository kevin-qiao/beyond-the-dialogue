appId: com.workboard.app
productName: WorkBoard
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - resources/**
npmRebuild: false
electronLanguages:
  - en-US
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: monster
  synopsis: AI-Native Work Board
deb:
  depends:
    - libgtk-3-0
    - libnss3
    - libasound2
win:
  target:
    - nsis
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
